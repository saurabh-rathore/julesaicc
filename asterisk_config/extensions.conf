; extensions.conf
;
#include "queues.conf"
;
; Dialplan logic for Asterisk. This is where you define how calls are handled.
;
; Note: This is a basic example. A real system would have more robust error handling,
; dynamic routing, and interaction with external scripts/AGIs for AI processing.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Define global variables here if needed
; VOICEMAIL_CONTEXT=default

; Context for calls coming from the PSTN (e.g., via a VoIP trunk)
[from-pstn]
exten => _X.,1,NoOp(Incoming call from PSTN: ${CALLERID(num)} to ${EXTEN})
  ; _X. matches any phone number
  ; Replace 'your_did_number' with the actual DID number if routing by DID
  ; exten => your_did_number,1,NoOp(Incoming call for DID ${EXTEN})
  same => n,Answer()
  same => n,Wait(1)
  ; Send call to the AI handling context
  same => n,Goto(ai-call-handler,s,1)
  same => n,Hangup()

; Context for calls from internal SIP users/phones (if any)
; [internal-users]
; exten => _1XX,1,NoOp(Call from internal user ${CALLERID(num)} to ${EXTEN})
;   same => n,Dial(SIP/${EXTEN})
;   same => n,Hangup()
;
; exten => _*97,1,Answer() ; Example: Voicemail access
;   same => n,VoicemailMain(${CALLERID(num)}@${VOICEMAIL_CONTEXT})
;   same => n,Hangup()


; Context for handling calls with the AI
[ai-call-handler]
exten => s,1,NoOp(Starting AI call handler for ${CALLERID(num)})
  same => n,Answer()
  ; Play a brief welcome message (optional)
  ; same => n,Playback(custom/welcome-message) ; Requires you to have this sound file

  ; Here, you would typically initiate communication with your Node.js backend.
  ; This could be done via:
  ; 1. AGI (Asterisk Gateway Interface): Run a script that communicates with your AI.
  ;    Example: same => n,AGI(agi://your_nodejs_server_ip:port/handle_call)
  ;             or same => n,AGI(agi_script.js,${CALLERID(num)},${CHANNEL})
  ;
  ; 2. AMI (Asterisk Manager Interface): Your Node.js app listens for Newchannel events
  ;    and then takes control of the call using AMI commands (e.g., Playback, SpeechRecognize, etc.)
  ;    This is a common approach for external call control.
  ;
  ; 3. ARI (Asterisk REST Interface): For more fine-grained control, often preferred for new projects.
  ;    Requires setting up ARI in Asterisk and an application that interacts with the REST API.
  ;    Example: same => n,Stasis(my-ai-app,${CALLERID(num)})
  ;
  ; For this project, the plan is to use AMI from the Node.js backend.
  ; So, the dialplan might simply keep the call alive or pass it to a parking lot,
  ; while the Node.js app, notified by an AMI event (e.g., Newchannel or specific event generated by Dial),
  ; starts interacting. Alternatively, an AGI script could make an HTTP request to the Node.js API.

  ; For demonstration, let's assume the Node.js application will pick up the call details via AMI
  ; and then control it. We might put the call into a holding pattern or a simple application
  ; that the AMI can then redirect.
  ;
  ; Example: Using Park application. Node.js can then use AMI to unpark and control.
  ; same => n,Park()
  ;
  ; Or, a simpler approach for now: just wait for external control via AMI.
  ; The Node.js app will detect the 'Newchannel' event for this context/extension
  ; and then use AMI commands like 'Originate' (if it needs to transfer), 'SetVar',
  ; 'PlayDTMF', 'Bridge', 'Redirect', etc. For STT/TTS, it will manage audio streams
  ; or use Asterisk applications like SpeechCreate, SpeechBackground via AMI.

  same => n,Set(CHANNEL(language)=${initial_language_preference}) ; If language is passed or detected early
  same => n,NoOp(Call for ${CALLERID(num)} to ${EXTEN} entering AI handler)
  same => n,Set(AI_CALL_ID=${UNIQUEID}) ; Set a channel variable for the call ID
  same => n,Set(AI_CALLER_NUM=${CALLERID(num)})
  same => n,Set(AI_LANGUAGE=${CHANNEL(language)})

  ; Node.js backend (aiCallHandlerService.startAiCall) will:
  ; 1. Log the call, update status to 'answered_ai'.
  ; 2. Play a greeting message via AMI Playback.
  ; 3. Set a channel variable e.g., AI_CALL_ACTIVE=true via AMI.
  ; This dialplan then proceeds to the AGI script for the first user input.

exten => s,n(start_ai_turn),NoOp(AI Turn: Channel ${CHANNEL}, Call ID ${AI_CALL_ID})
  ; Check if the call should continue being handled by AI
  ; The backend can set AI_CALL_ACTIVE to 'false' via AMI to break this loop.
  same => n,GotoIf($["${AI_CALL_ACTIVE}" = "false"]?ai_hangup)

  same => n,NoOp(AI_CALL_ACTIVE is true or not set, proceeding with AGI recording)
  ; Invoke the AGI script to record the user's response.
  ; The AGI script will notify the backend when recording is complete.
  same => n,AGI(main_ai_interaction.agi.js,${AI_CALL_ID},${AI_CALLER_NUM},${AI_LANGUAGE})

  ; After AGI script finishes, it will have notified the backend.
  ; The backend (aiCallHandlerService.processRecordedAudio) will:
  ;   - Perform STT, LLM, TTS.
  ;   - Play the AI's response via AMI Playback (this is non-blocking for dialplan).
  ;   - If conversation continues, it ensures AI_CALL_ACTIVE remains true (or is set).
  ;   - If call should end/escalate, it will set AI_CALL_ACTIVE=false or redirect/hangup via AMI.

  same => n,NoOp(AGI script finished for ${AI_CALL_ID}. AI response (TTS) should be playing or have played via AMI.)
  same => n,Wait(1) ; Brief pause. Allows TTS to play. Might need adjustment or a more robust sync mechanism.
  same => n,Goto(start_ai_turn) ; Loop back to record next utterance if AI_CALL_ACTIVE is still true.

exten => s,n(ai_hangup),NoOp(AI_CALL_ACTIVE is false or call ended by AI. Hanging up call ${AI_CALL_ID})
  same => n,Hangup()

exten => h,1,NoOp(Call hung up in AI handler: ${CHANNEL} status: ${HANGUPCAUSE}, CallID: ${AI_CALL_ID})
  ; Add any cleanup or notification logic here (e.g., notify Node.js backend via AGI/HTTP or AMI)
  ; Example: Notify backend about the hangup, ensuring it's idempotent if endAiCall was already triggered.
  same => n,System(curl -X POST -H "Content-Type: application/json" -d '{"callId":"${UNIQUEID}", "channel":"${CHANNEL}", "event":"hangup", "cause":"${HANGUPCAUSE}"}' http://localhost:3000/api/internal/call-event)


; Context for escalated calls, typically where queues are handled.
; The name of this context should match process.env.ASTERISK_QUEUE_CONTEXT (default 'queues')
[queues]
; The extension here should match process.env.ASTERISK_QUEUE_NAME (default 'support-queue')
exten => support-queue,1,NoOp(Call ${CALLERID(num)} entering support queue)
  same => n,Answer() ; Answer if not already answered
  same => n,Playback(queue-thankyou) ; Play a thank you message (ensure this file exists or use a generic one)
  same => n,Queue(support-queue)     ; Place the call into the 'support-queue' defined in queues.conf
  same => n,Hangup()

exten => h,1,NoOp(Call hung up in queue context: ${CHANNEL} status: ${HANGUPCAUSE})
  ; Add any cleanup or notification logic here for calls ending from the queue


; Context for simple agents used for testing queues
[queue-agents]
exten => demo-agent,1,NoOp(Demo agent ${CHANNEL} received call from queue)
  same => n,Answer()
  same => n,Playback(custom/agent-greeting) ; Play a greeting
  same => n,Wait(10) ; Simulate agent talking
  same => n,Playback(custom/agent-goodbye)  ; Play a goodbye
  same => n,Hangup()


; Default context if no other context matches (e.g. from guest)
[public]
exten => _.,1,NoOp(Unauthenticated call attempt from ${CALLERID(num)} to ${EXTEN})
  same => n,Hangup()

; Context for calls originating from the Node.js application (e.g., click-to-call)
; The Node.js app would use AMI's Originate command specifying this context.
[from-internal]
exten => _X.,1,NoOp(Outbound call initiated by application for ${EXTEN})
  ; This could be a direct dial to an external number via a trunk
  ; same => n,Dial(SIP/my-voip-provider/${EXTEN})
  ; Or it could be a call to an internal extension/application
  same => n,Verbose(1, Application-originated call to ${EXTEN}. For now, just a NoOp.)
  same => n,Hangup()

; Add more contexts and extensions as needed for specific features.
; For example, multilingual IVR menus, database lookups via Asterisk func_odbc, etc.
;
; To integrate Whisper and Coqui TTS, the Node.js backend will handle the audio.
; - For STT (Whisper):
;   The Node.js app might use AMI to record audio (e.g., Record or Monitor commands),
;   then fetch the recording and process it with Whisper.
;   Or, if Asterisk has a direct STT integration module that supports Whisper (less common for self-hosted Whisper),
;   it could be invoked here. For this project, backend processing of recorded audio is assumed.
;
; - For TTS (Coqui):
;   The Node.js app will generate audio using Coqui TTS and then use AMI to play it back
;   on the call channel (e.g., Playback command with a streamed file, or StreamFile).
;   Asterisk's `Festival` or other TTS engines can be called from dialplan, but direct Coqui
;   integration from dialplan is unlikely without custom modules. The Node.js backend provides this bridge.
