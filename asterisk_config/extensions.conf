; =================================================================================
; extensions.conf
; =================================================================================
;
; This file is the core of Asterisk's logic, known as the "dialplan".
; It defines what happens when a call comes in or goes out.
; The dialplan is organized into "contexts", which are like separate modules.
;
#include "queues.conf" ; Includes the queue definitions from queues.conf

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; You can define global variables here if needed.
; Example: VOICEMAIL_CONTEXT=default

; ---------------------------------------------------------------------------------
; Context: [from-pstn] - Entry Point for External Calls
; ---------------------------------------------------------------------------------
; This context handles calls coming from your VoIP provider (the Public Switched
; Telephone Network). When a call arrives on the trunk defined in sip.conf,
; Asterisk sends it to the context named in that trunk's configuration.
; We assume the trunk is configured with `context=from-pstn`.
[from-pstn]
; This line matches any incoming phone number (_X. is a pattern for any number).
exten => _X.,1,NoOp(==> Incoming call from ${CALLERID(num)} to ${EXTEN} received.)
  same => n,Answer() ; Answer the call.
  same => n,Wait(1)  ; Wait for 1 second to ensure the channel is stable.
  ; This is the most important step: transfer the call to the AI handler.
  same => n,Goto(ai-call-handler,s,1)
  same => n,Hangup() ; Hang up if the Goto fails for some reason.

; ---------------------------------------------------------------------------------
; Context: [ai-call-handler] - The Core AI Interaction Logic
; ---------------------------------------------------------------------------------
; This context manages the conversation between the caller and the AI backend.
; It uses an AGI script as a bridge to the Node.js application.
[ai-call-handler]
; The 's' extension is the special "start" extension for a context.
exten => s,1,NoOp(==> AI Call Handler Started for channel ${CHANNEL})
  same => n,Answer() ; Ensure the call is answered if it somehow wasn't already.

  ; Set channel variables that the AGI script and backend can use to identify the call.
  same => n,Set(AI_CALL_ID=${UNIQUEID})
  same => n,Set(AI_CALLER_NUM=${CALLERID(num)})
  same => n,Set(AI_LANGUAGE=${CHANNEL(language)}) ; Set language if detected earlier.

  ; This label marks the beginning of the conversational turn loop.
exten => s,n(start_ai_turn),NoOp(==> Beginning AI turn for call ${AI_CALL_ID})
  ; The backend application controls the conversation by setting the AI_CALL_ACTIVE variable via AMI.
  ; If the backend decides the call should end or be escalated, it will set this variable to 'false'.
  same => n,GotoIf($["${AI_CALL_ACTIVE}" = "false"]?ai_hangup)

  ; If the call is still active, we execute the AGI script.
  ; AGI (Asterisk Gateway Interface) allows an external script to take control of the call.
  same => n,NoOp(AI call is active. Executing AGI script...)
  ; We pass the call ID, caller number, and language to the script as arguments.
  same => n,AGI(main_ai_interaction.agi.js,${AI_CALL_ID},${AI_CALLER_NUM},${AI_LANGUAGE})
  ; --- At this point, Asterisk waits for the AGI script to finish ---
  ; The AGI script will:
  ;   1. Play a beep and record the user's utterance to a temporary audio file.
  ;   2. Make an HTTP request to the backend API (`/api/internal/recording-complete`) with the path to the audio file.
  ;   3. The backend (aiCallHandlerService) will then:
  ;      a. Transcribe the audio (STT).
  ;      b. Get a response from the NLU/LLM service.
  ;      c. Generate a spoken response (TTS) and save it to another audio file.
  ;   4. The backend will then use an AMI command to play the AI's spoken response back to the user on the current channel.
  ;   5. The AGI script exits, handing control back to the dialplan here.

  same => n,NoOp(AGI script finished. AI response has been played via AMI.)
  same => n,Wait(1) ; A brief pause. This can help prevent race conditions.
  ; Loop back to the start of the turn to listen for the user's next utterance.
  same => n,Goto(start_ai_turn)

; This label is the exit point for the loop.
exten => s,n(ai_hangup),NoOp(==> AI call ended. Hanging up channel ${CHANNEL})
  same => n,Hangup()

; The 'h' extension is a special extension that runs automatically when a channel hangs up.
exten => h,1,NoOp(==> Call hung up. Cause: ${HANGUPCAUSE}. Performing cleanup for call ${AI_CALL_ID}.)
  ; This is a good place for cleanup tasks.
  ; We can notify the backend that the call has officially ended for any final logging.
  ; The System() command executes a shell command. `curl` is used here to make an HTTP request.
  same => n,System(curl -X POST -H "Content-Type: application/json" -d '{"callId":"${UNIQUEID}", "channel":"${CHANNEL}", "event":"hangup", "cause":"${HANGUPCAUSE}"}' http://localhost:3000/api/internal/call-event)

; ---------------------------------------------------------------------------------
; Context: [queues] - Human Agent Escalation
; ---------------------------------------------------------------------------------
; When the AI decides to escalate, the backend uses an AMI command to redirect
; the call to this context and the 'support-queue' extension.
[queues]
exten => support-queue,1,NoOp(==> Call ${CALLERID(num)} escalating to human agent queue.)
  same => n,Answer()
  ; same => n,Playback(queue-thankyou) ; You can play a message before they enter the queue.
  ; This command places the caller into the queue named 'support-queue' (defined in queues.conf).
  same => n,Queue(support-queue)
  same => n,Hangup() ; Hang up after the caller finishes with the agent.

; ---------------------------------------------------------------------------------
; Context: [queue-agents] - For Testing Queues
; ---------------------------------------------------------------------------------
; This context provides a simple "demo agent" so you can test the queue
; functionality without needing a real person on a SIP phone.
[queue-agents]
exten => demo-agent,1,NoOp(==> Demo agent answering call from queue.)
  same => n,Answer()
  same => n,Playback(custom/agent-greeting) ; Requires this sound file.
  same => n,Wait(10)
  same => n,Playback(custom/agent-goodbye)  ; Requires this sound file.
  same => n,Hangup()

; ---------------------------------------------------------------------------------
; Context: [from-internal] & [public]
; ---------------------------------------------------------------------------------
; These are example contexts for handling calls from internal users or blocking
; unauthenticated calls.
[public]
exten => _.,1,NoOp(Unauthenticated call attempt from ${CALLERID(num)} to ${EXTEN}. Rejecting.)
  same => n,Hangup()

[from-internal]
exten => _X.,1,NoOp(Application-originated call to ${EXTEN}. Not configured.)
  same => n,Hangup()
