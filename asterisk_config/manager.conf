; manager.conf
;
; Configuration for the Asterisk Manager Interface (AMI).
; This allows external applications to control and monitor Asterisk.
;
; Security: Change the default username and secret!
;           Restrict access using 'permit' and 'deny' to specific IP addresses.

[general]
enabled = yes
port = 5038                 ; Default AMI port
bindaddr = 0.0.0.0          ; Listen on all interfaces. Restrict if possible.
; httptimeout = 60
; displayconnects = yes     ; Display connects in 'manager show connected'
; timestampevents = yes     ; Add Timestamp field to events (useful for debugging)

; Admin user for the Node.js backend application
; Replace 'ami_username' and 'ami_secret' with strong, unique credentials.
[ami_user]                  ; This username is referenced in backend/.env (AMI_USERNAME)
secret = supersecretpassword ; This password is referenced in backend/.env (AMI_PASSWORD)
deny=0.0.0.0/0
permit=127.0.0.1/255.255.255.0 ; Permit localhost access
; permit=192.168.1.0/255.255.255.0 ; Example: Permit access from a specific subnet

; Permissions for the AMI user.
; 'system', 'call', 'log', 'verbose', 'command', 'agent', 'user', 'config', 'dtmf', 'reporting', 'cdr', 'dialplan', 'originate', 'message'
; 'read' and 'write' are categories that group multiple permissions.
; For the AI call center, we'll likely need a range of permissions.
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message
; More granular permissions are better if you know exactly what's needed.
; Example for broad permissions (adjust based on actual backend needs):
; read = all
; write = all

; Example of a more restricted user (if needed for other purposes)
; [another_user]
; secret = anothersecret
; deny=0.0.0.0/0
; permit=127.0.0.1/255.255.255.0
; read = call,log
; write = originate

; To apply changes to manager.conf, run 'manager reload' in the Asterisk CLI.
; *CLI> manager reload
