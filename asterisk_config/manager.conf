; =================================================================================
; manager.conf
; =================================================================================
;
; This file configures the Asterisk Manager Interface (AMI), which is the
; powerful API our backend Node.js application uses to control and monitor
; Asterisk in real-time (e.g., to start recordings, get call events, etc.).

[general]
; --- General AMI Settings ---
enabled = yes
port = 5038                 ; Default AMI port. Ensure this matches the `AMI_PORT` in the backend's .env file.
bindaddr = 0.0.0.0          ; Listen on all network interfaces. For production, it's more secure to
                            ; bind this to the specific IP address of your application server's network interface.
; timestampevents = yes     ; Useful for debugging. Adds a 'Timestamp' field to all events.

; ---------------------------------------------------------------------------------
; SECTION 1: AMI User for Backend Application
; ---------------------------------------------------------------------------------
; This section defines the user account that the Node.js backend will use to log in to AMI.
;
; !!! ACTION REQUIRED !!!
; You MUST change the username and secret to secure, unique values.
; These values must then be copied into the backend's .env file.

[admin]                     ; 1. CHOOSE a username for the application.
                            ;    This value must match `AMI_USERNAME` in the backend's .env file.
secret = your_ami_secret    ; 2. SET a very strong, unique password here.
                            ;    This value must match `AMI_PASSWORD` in the backend's .env file.

; --- SECURITY: IP Address Permissions ---
; It is CRITICAL to restrict which IP addresses can connect to AMI.
; The rules are read from top to bottom. The first match wins.
deny=0.0.0.0/0              ; 3. First, deny all connections from everywhere.
permit=127.0.0.1/255.255.255.255 ; 4. Then, specifically permit the IP address of your backend server.
                            ;    If the backend runs on the same machine as Asterisk, 127.0.0.1 is correct.
                            ;    If it runs on a different server (e.g., 10.0.1.50), use: permit=10.0.1.50/255.255.255.255

; --- PERMISSIONS: User Capabilities ---
; This defines what this AMI user is allowed to do. The permissions are grouped
; into 'read' (monitoring) and 'write' (performing actions) categories.
; The settings below are very permissive to ensure all features of the application
; work out-of-the-box. For a high-security environment, you could narrow these down
; to only the specific commands the application needs.
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message

; To apply changes to this file, run the following command in the Asterisk CLI:
; *CLI> manager reload
