; =================================================================================
; queues.conf
; =================================================================================
;
; This file configures call queues, which are used to hold incoming calls
; and distribute them to a group of human agents. This is where calls are
; sent when the AI decides to escalate.

[general]
; These are global settings for all queues.
persistentmembers = yes      ; If yes, statically defined members are not stored in the database, but in this file.
autofill = yes               ; If yes, send waiting callers to available agents immediately.
monitor-format = wav         ; Record queue calls in WAV format.
shared_lastcall = yes        ; Distribute calls more evenly amongst agents.

; ---------------------------------------------------------------------------------
; SECTION 1: Support Queue Definition
; ---------------------------------------------------------------------------------
; This is the main queue for handling escalations from the AI.
; The name 'support-queue' is referenced in extensions.conf.

[support-queue]
musicclass = default                 ; Plays the 'default' music on hold for waiting callers.
strategy = ringall                   ; How to distribute calls to agents. 'ringall' rings all available agents simultaneously.
                                     ; Other options: 'leastrecent', 'fewestcalls', 'random', 'rrmemory'.
timeout = 20                         ; Ring agents for 20 seconds before considering the call unanswered by that agent.
retry = 2                            ; How long to wait before trying the next agent(s) again.
wrapuptime = 10                      ; Give agents 10 seconds of "wrap-up" time after a call before sending them another one.
maxlen = 0                           ; Maximum number of callers allowed in the queue (0 = unlimited).
announce-frequency = 60              ; Announce queue position/hold time to the caller every 60 seconds.
announce-holdtime = yes              ; Announce the estimated hold time.
; announce-position = yes            ; Announce the caller's position in the queue.

; ---------------------------------------------------------------------------------
; SECTION 2: Queue Members (Human Agents)
; ---------------------------------------------------------------------------------
; This defines which SIP phones (agents) are part of the queue.
;
; For a production environment, agents are typically added as DYNAMIC members,
; meaning they log in and out of the queue. This is handled via the dialplan
; or an external application.
;
; For testing or simple setups, you can add STATIC members here.
;
; !!! ACTION REQUIRED !!!
; Add your agent phones here as static members for testing.
; The name (e.g., '101') must match the SIP phone you configured in sip.conf.

; member => SIP/101
; member => SIP/102

; The line below is an example for testing the queue without a live agent.
; It sends the call to the 'demo-agent' context in extensions.conf.
; You can comment this out when you have real agents configured.
member => Local/demo-agent@queue-agents
