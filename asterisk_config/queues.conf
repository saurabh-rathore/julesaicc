; queues.conf
;
; Example Queue Configuration for AI Call Center Escalation

[general]
persistentmembers = yes
autofill = yes
monitor-format = wav
shared_lastcall = yes

; Define the support queue
; Agents will log into this queue.
; For testing, you can have a simple setup.
[support-queue]
musicclass = default                 ; Music on hold class
strategy = ringall                   ; Ring all available agents
timeout = 20                         ; Ring agents for 20 seconds
retry = 2                            ; Retry 2 times
wrapuptime = 10                      ; 10 seconds wrap-up time for agents
maxlen = 0                           ; No limit on queue length (0 means unlimited)
announce-frequency = 60              ; Announce position/holdtime every 60 seconds
announce-holdtime = yes              ; Announce estimated hold time
; announce-position = yes            ; Announce position in queue
; periodic-announce-frequency = 60   ; Announce a periodic message every 60 seconds
; periodic-announce = custom/queue-periodic-announce ; Custom message

; Define agents - these are placeholders.
; In a real system, agents would log in dynamically (e.g., AddQueueMember from AMI or AgentLogin dialplan app).
; For static members for testing:
; member => SIP/agent101
; member => SIP/agent102
; member => Local/2001@from-internal ; Example for a local extension

; You would need corresponding SIP peers in sip.conf for SIP/agent101, SIP/agent102
; or entries in extensions.conf for Local/2001@from-internal if they are complex extensions.

; Example of a simple agent that just plays a message and hangs up (for testing queue functionality without live agents)
member => Local/demo-agent@queue-agents

; You can also specify penalties, skills, etc., for members.
; member => SIP/agent101,10 ; Agent with penalty 10
; member => SIP/agent103,0,John Doe,SIP/agent103_if ; Agent with name and specific interface
