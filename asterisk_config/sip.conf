; =================================================================================
; sip.conf
; =================================================================================
;
; This file configures SIP (Session Initiation Protocol) connections, which are
; used to connect to your VoIP provider (to make/receive calls to the outside
; world) and to connect to internal SIP phones for human agents.
;
; NOTE: This is a minimal example. A production system would have more detailed
; configurations, including codecs, NAT handling, security (TLS/SRTP), etc.

[general]
; --- General SIP Settings ---
; These settings apply to all SIP connections unless overridden.
context=public                     ; Default context for incoming calls from unknown sources.
allowguest=no                    ; IMPORTANT: Disables unauthenticated calls for security.
udpbindaddr=0.0.0.0:5060         ; Listen on all network interfaces for UDP SIP traffic.
tcpenable=no                     ; Disable TCP for SIP (enable if your provider requires it).
transport=udp                    ; Default transport protocol.
srvlookup=yes                    ; Enable DNS SRV lookups for outbound calls to your provider.
disallow=all                     ; Best practice: Disallow all codecs first...
allow=ulaw                       ; ...then allow only the specific codecs you need.
allow=alaw                       ; (ulaw for North America, alaw for Europe/rest of world)
allow=gsm
language=en                      ; Default language for Asterisk's built-in voice prompts.

; ---------------------------------------------------------------------------------
; SECTION 1: VoIP Provider Trunk
; ---------------------------------------------------------------------------------
; This is where you configure the connection to your telephone service provider.
; You will get these details from your provider (e.g., Twilio, Vonage, Bandwidth).
;
; !!! ACTION REQUIRED !!!
; Uncomment this section and replace the placeholder values with your provider's details.

; [my-voip-provider-trunk]       ; Choose a descriptive name.
; type=peer                      ; 'peer' is typical for a provider trunk.
; host=sip.yourprovider.com      ; The SIP domain or IP address of your provider.
; defaultuser=your_username      ; The authentication username from your provider.
; secret=your_very_secure_password ; The authentication password from your provider.
; context=from-pstn              ; IMPORTANT: This tells Asterisk where to send incoming calls from this trunk.
;                                ; This context name MUST match a context in extensions.conf.
; insecure=port,invite           ; Often required if your provider authenticates on registration but not per-call.
; dtmfmode=rfc2833               ; Standard for sending touch-tone signals.
; canreinvite=no                 ; Helps with NAT traversal. Change to 'yes' if you have a public IP and understand the implications.
; qualify=yes                    ; Checks if the provider is reachable.

; ---------------------------------------------------------------------------------
; SECTION 2: Internal SIP Phones (for Human Agents)
; ---------------------------------------------------------------------------------
; Define SIP accounts for physical phones or softphones that human agents will use.
;
; !!! ACTION REQUIRED !!!
; Create one of these sections for each human agent phone.

; [101]                          ; A short, unique extension number for the agent.
; type=friend                    ; 'friend' allows making and receiving calls.
; host=dynamic                   ; Allows the phone to register from any IP address on your local network.
; secret=AgentPhoneSecret123     ; A strong, unique password for this phone.
; context=from-internal          ; The context in extensions.conf that defines what this phone can dial.
; callerid="Support Agent 1" <101> ; The name and number that appears on other phones.
; disallow=all
; allow=ulaw
; allow=alaw
; mailbox=101@default            ; If you set up voicemail, this links the phone to a mailbox.

; [102]
; type=friend
; host=dynamic
; secret=AnotherAgentSecret456
; context=from-internal
; callerid="Support Agent 2" <102>
; disallow=all
; allow=ulaw
; allow=alaw
; mailbox=102@default

; ---------------------------------------------------------------------------------
; SECTION 3: Application Interface (Informational)
; ---------------------------------------------------------------------------------
; The backend application primarily uses the Asterisk Manager Interface (AMI),
; which is configured in manager.conf, not here. A SIP peer for the app
; is generally not needed for the current architecture. The section below is
; commented out to avoid confusion but left as an example for advanced scenarios.

; [app-interface]
; type=friend
; host=dynamic
; secret=app_secret_very_secure
; context=from-internal
; disallow=all
; allow=ulaw
; allow=alaw
; dtmfmode=rfc2833
