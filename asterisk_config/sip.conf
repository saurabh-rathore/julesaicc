; sip.conf
;
; Configuration for SIP (Session Initiation Protocol) peers, users, and global settings.
;
; Note: This is a minimal example. A production system would have more detailed
; configurations, including codecs, NAT handling, security (TLS/SRTP), etc.

[general]
context=public                     ; Default context for incoming calls
allowguest=no                    ; Disable unauthenticated calls
udpbindaddr=0.0.0.0:5060         ; Listen on all interfaces for UDP SIP traffic
tcpenable=no                     ; Disable TCP for SIP (enable if needed)
transport=udp                    ; Default transport protocol
srvlookup=yes                    ; Enable DNS SRV lookups for outbound calls
disallow=all                     ; Disallow all codecs first
allow=ulaw                       ; Allow specific codecs
allow=alaw
allow=gsm
language=en                      ; Default language for prompts

; VoIP Provider Trunk Example (replace with your actual provider details)
; [my-voip-provider]
; type=peer
; host=sip.provider.com
; defaultuser=your_username
; secret=your_password
; context=from-pstn                ; Context for calls incoming from this trunk
; insecure=port,invite             ; If provider requires this (use with caution)
; dtmfmode=rfc2833
; canreinvite=no
; qualify=yes

; Peer for Node.js application to receive calls or originate actions (e.g., via AMI)
; This peer might be used if Asterisk needs to send a call TO the Node.js app's controlled endpoint,
; or if the Node.js app originates calls using this peer's context.
; More commonly, the Node.js app will use AMI to control existing calls or originate new ones
; through a dialplan context that doesn't necessarily require a dedicated SIP peer for the app itself.
[app-interface]
type=friend
host=dynamic                     ; Or static IP of your Node.js server if Asterisk is remote
secret=app_secret_very_secure    ; Secure password
context=from-internal            ; Context for calls from the application
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833

; Example SIP phone/client
; [my-sip-phone-100]
; type=friend
; host=dynamic
; secret=phone_secret_123
; context=internal-users
; callerid="Sales Phone 1" <100>
; disallow=all
; allow=ulaw
; allow=alaw
; mailbox=100@default ; Voicemail
