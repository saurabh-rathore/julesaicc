<!-- Main App Component HTML -->
<header class="app-header" *ngIf="isLoggedIn">
  <nav>
    <a routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
    <a routerLink="/calls" routerLinkActive="active-link">Call Logs</a>
    <!-- Add other navigation links here, e.g., for Feedback, Analytics (if separate from dashboard) -->
    <button (click)="logout()" class="logout-button-header">Logout</button>
  </nav>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
