<div class="fine-tuning-container">
  <h2>AI Model Fine-Tuning</h2>
  <form (ngSubmit)="onFineTune()">
    <div class="form-group">
      <label for="model">Select Model:</label>
      <select id="model" [(ngModel)]="selectedModel" name="model">
        <option value="stt">STT (Speech-to-Text)</option>
        <option value="llm">LLM (Large Language Model)</option>
        <option value="tts">TTS (Text-to-Speech)</option>
      </select>
    </div>
    <button type="submit" [disabled]="!selectedModel">Start Fine-Tuning</button>
  </form>
</div>
