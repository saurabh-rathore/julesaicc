# NGINX Configuration for AI Call Center
#
# In a real deployment, this file should be copied to:
# /etc/nginx/sites-available/your-ai-center.com
#
# And then enabled with:
# sudo ln -s /etc/nginx/sites-available/your-ai-center.com /etc/nginx/sites-enabled/
#
server {
    listen 80;
    server_name your-ai-center.com;

    # Redirect HTTP to HTTPS for SSL
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-ai-center.com;

    # SSL settings will be managed by Certbot.
    # Certbot will automatically add the correct paths for the certificate and key.
    # ssl_certificate /etc/letsencrypt/live/your-ai-center.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-ai-center.com/privkey.pem;

    # The 'root' path must be the absolute path to the Angular app's build output.
    # You will need to replace '/path/to/project/' with the actual path on your server.
    root /path/to/project/frontend/ai-call-center-frontend/dist/ai-call-center-frontend/browser;
    index index.html index.htm;

    # This ensures that Angular routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This reverse proxies all requests for '/api' to the backend Node.js server.
    location /api {
        proxy_pass http://localhost:3000; # The backend runs on port 3000
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
